plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rake

inherit_mode:
  merge:
    - Exclude

inherit_from:
  - ./layout.yml
  - ./lint.yml
  - ./style.yml
  - ./metrics.yml
  - ./rspec.yml
  - ./performance.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "data/**/*"
    - "**/bin/*"
    - "**/db/migrate/*.rb"
    - "**/db/queue_migrate/*.rb"
    - "**/db/schema.rb"
    - "**/node_modules/**/*"

# ====  GEMSPEC ====
Gemspec/DeprecatedAttributeAssignment:
  Enabled: true

Gemspec/DevelopmentDependencies:
  Enabled: true

Gemspec/RequireMFA:
  Enabled: true

# ====  NAMING  ====
Naming/BlockForwarding:
  Enabled: true
  EnforcedStyle: anonymous

# ====  INHOUSE  ====
Inhouse/DryInitializerParams:
  Description: "Prefer `option` over `param` when multiple arguments have no natural ordering."
  Enabled: true
  SafeAutoCorrect: false
  VersionAdded: "0.3.0"

Inhouse/PositiveNaming:
  Description: "Use positive names instead of names that describe the absence of a state."
  Enabled: true
  ForbiddenPrefixes:
    - not_
    - no_
    - non_
    - is_not_
    - has_no_
    - without_
  VersionAdded: "0.3.0"

# Rails-specific cop. Enabled by config/rails.yml.
Inhouse/Rails/DependentDeleteAll:
  Description: "Use the callback-free dependent option for an association unless its records need callbacks."
  Enabled: false
  SafeAutoCorrect: false
  VersionAdded: "0.3.0"

# ====  SECURITY  ====
Security/CompoundHash:
  Enabled: true

Security/IoMethods:
  Enabled: true
